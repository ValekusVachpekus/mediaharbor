name: Check and build
on:
  push:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools.lock.json'
      - 'tsconfig.json'
      - 'rust-toolchain*'
      - '.node-version'
      - '.nvmrc'
      - '!**/*.md'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools.lock.json'
      - 'tsconfig.json'
      - 'rust-toolchain*'
      - '.node-version'
      - '.nvmrc'
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks-debug-v2
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev ffmpeg
      - run: npm ci
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:dom
      - run: npm run extension:portable
      - run: npm run test:extension
      - run: npm run check -w @mediaharbor/extension
      - run: npm run extension:chrome
      - run: npm run extension:firefox
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p mediaharbor-core -- --include-ignored
      - run: python scripts/prepare-sidecar.py --debug
      - run: cargo check --locked -p mediaharbor-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ runner.os }}
          path: apps/extension/.output/
          include-hidden-files: true
          if-no-files-found: error
