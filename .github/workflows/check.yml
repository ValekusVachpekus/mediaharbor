name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev ffmpeg
      - run: npm ci
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:dom
      - run: npm run extension:portable
      - run: npm run test:extension
      - run: npm run check -w @mediaharbor/extension
      - run: npm run extension:chrome
      - run: npm run extension:firefox
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p mediaharbor-core -- --include-ignored
      - run: python scripts/prepare-sidecar.py --debug
      - run: cargo check --locked -p mediaharbor-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ runner.os }}
          path: apps/extension/.output/
          include-hidden-files: true
          if-no-files-found: error
